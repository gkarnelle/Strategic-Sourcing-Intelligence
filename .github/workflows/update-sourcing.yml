
name: Update GaiAnQi Sourcing Analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate_data.py
      - analyze.py
      - requirements.txt
      - .github/workflows/update-sourcing.yml

permissions:
  contents: write

jobs:
  update-sourcing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib numpy

      - name: Generate connected sourcing data
        run: python generate_data.py

      - name: Run sourcing analytics
        run: python analyze.py

      - name: Commit updated datasets and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suppliers.csv purchase_orders.csv transactions.csv outputs/
          if ! git diff --cached --quiet; then
            git commit -m "data: Refresh connected GaiAnQi sourcing analytics"
            git push
          else
            echo "No changes to commit"
          fi
